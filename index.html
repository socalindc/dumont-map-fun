<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Southern Blues Restaurant - Site Survey Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3A5C; --green:#2E7D32; --orange:#E65100; --purple:#5e35b1; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif}
.app{display:flex;height:100%;overflow:hidden}
.sidebar{
  width:380px;height:100%;background:var(--white);
  display:flex;flex-direction:column;border-right:1px solid #e5e5e5;z-index:10
}
.sidebar-header{
  padding:20px 24px;background:linear-gradient(135deg,var(--navy) 0%,#0d2240 100%);color:#fff
}
.sidebar-header h1{font-size:18px;font-weight:700;margin-bottom:4px}
.sidebar-header p{font-size:12px;opacity:.8}
.legend{padding:12px 24px;border-bottom:1px solid #eee;display:flex;gap:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#666}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.property-list{flex:1;overflow-y:auto}
.property-card{
  padding:16px 24px;border-bottom:1px solid #f0f0f0;cursor:pointer;
  transition:background .15s;border-left:3px solid transparent
}
.property-card:hover{background:#f5f8fc}
.property-card.active{background:#eef3fa;border-left-color:var(--navy)}
.card-rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:12px;font-weight:700;
  margin-right:8px;flex-shrink:0;vertical-align:middle
}
.card-rank.rank-top{background:var(--green)}
.card-rank.rank-conditional{background:var(--orange)}
.card-rank.rank-premium{background:var(--purple)}
.card-header{display:flex;align-items:center}
.card-name{font-weight:600;font-size:14px;color:#1a1a1a}
.card-location{font-size:12px;color:#888;margin-top:2px;margin-left:32px}
.card-details{display:flex;gap:12px;margin-top:8px;margin-left:32px;flex-wrap:wrap}
.card-detail{font-size:11px;color:#555}
.card-detail strong{color:#1a1a1a}
.card-badge{
  display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;
  margin-top:6px;margin-left:32px
}
.badge-top{background:#e8f5e9;color:var(--green)}
.badge-strong{background:#e8f5e9;color:var(--green)}
.badge-solid{background:#e3f2fd;color:var(--navy)}
.badge-conditional{background:#fff3e0;color:var(--orange)}
.badge-premium{background:#ede7f6;color:var(--purple)}
.map-wrap{position:relative;flex:1;height:100%}
#map{width:100%;height:100%}
.mapboxgl-popup{max-width:320px !important}
.mapboxgl-popup-content{
  padding:0 !important;border-radius:12px !important;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.18) !important;font-family:'Inter',sans-serif !important
}
.mapboxgl-popup-close-button{font-size:18px;padding:4px 8px;color:#999}
.popup-header{padding:14px 16px 10px;border-bottom:1px solid #f0f0f0}
.popup-name{font-weight:700;font-size:15px;color:var(--navy)}
.popup-address{font-size:11px;color:#999;margin-top:2px}
.popup-body{padding:10px 16px 14px}
.popup-row{
  display:flex;justify-content:space-between;align-items:flex-start;
  font-size:12px;padding:5px 0;border-bottom:1px solid #f8f8f8
}
.popup-row:last-child{border-bottom:none}
.popup-label{color:#999;flex-shrink:0;margin-right:12px}
.popup-value{font-weight:600;color:#333;text-align:right}
.popup-exclusive{
  margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff3e0;
  font-size:11px;color:#bf360c;line-height:1.4
}
.popup-badge-wrap{text-align:center;padding:8px 16px 12px}
.style-switcher{
  position:absolute;top:12px;right:12px;z-index:5;display:flex;border-radius:8px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.style-btn{
  padding:8px 14px;font-size:12px;font-family:'Inter',sans-serif;border:none;cursor:pointer;
  background:#fff;color:#555;font-weight:500;transition:all .15s;border-right:1px solid #eee
}
.style-btn:last-child{border-right:none}
.style-btn.active{background:var(--navy);color:#fff}
.style-btn:hover:not(.active){background:#f0f0f0}
@media (max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:45%;order:2}
  .map-wrap{height:55%;order:1}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Southern Blues Restaurant</h1>
      <p>Site Survey - 7 Available Locations | Prepared by Renaud Consulting</p>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2E7D32"></div> Top Pick</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1B3A5C"></div> Strong / Solid</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E65100"></div> Conditional</div>
      <div class="legend-item"><div class="legend-dot" style="background:#5e35b1"></div> Premium</div>
    </div>
    <div class="property-list" id="propertyList"></div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="style-switcher" id="styleSwitcher" aria-label="Map style switcher">
      <button class="style-btn" data-style="kepler" type="button">Kepler</button>
      <button class="style-btn active" data-style="satellite" type="button">Satellite</button>
      <button class="style-btn" data-style="streets" type="button">Streets</button>
      <button class="style-btn" data-style="dark" type="button">Dark</button>
    </div>
  </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>

<script>
(function () {
  "use strict";

  mapboxgl.accessToken =
    "pk.eyJ1IjoiYW5kcmV3cDc1IiwiYSI6ImNtYjhqcmlteDBuOG8yaHB3bXNhb2g0b2EifQ.AFvwEVVNzNQD_D37euKBug";

  var properties = [
    { rank:1, name:"Hopkins Place", address:"2299 Johns Hopkins Rd, Gambrills, MD 21054",
      lat:39.0288, lng:-76.6844, sf:"\u00b12,650 SF", rent:"$34.50/SF all-in", monthly:"$7,619/mo",
      rating:"TOP PICK", badgeClass:"badge-top", color:"#2E7D32", rankClass:"rank-top",
      why:"Lowest rent, restaurant-ready (former Pizza Hut), no restrictions", exclusive:null },
    { rank:2, name:"Hilltop Plaza", address:"6700 Race Track Rd, Bowie, MD 20715",
      lat:38.9836, lng:-76.7299, sf:"2,428 SF", rent:"~$47/SF all-in", monthly:"$9,510/mo",
      rating:"STRONG", badgeClass:"badge-strong", color:"#1B3A5C", rankClass:"",
      why:"Dual grocery-anchored (Aldi + MOM\u2019s), flexible sizing",
      exclusive:"Hangry Joe\u2019s chicken clause (50% threshold) \u2014 Southern Blues complies at ~30%" },
    { rank:3, name:"Fairwood Greens", address:"12420 Fairwood Pkwy, Bowie, MD 20720",
      lat:38.9654, lng:-76.7893, sf:"1,750 SF", rent:"$42.05/SF all-in", monthly:"$6,133/mo",
      rating:"STRONG", badgeClass:"badge-strong", color:"#1B3A5C", rankClass:"",
      why:"Safeway-anchored, lowest monthly cost, master-planned community", exclusive:null },
    { rank:4, name:"Crofton Centre", address:"1501 Crofton Center, Crofton, MD 21114",
      lat:39.0153, lng:-76.6956, sf:"3,035 SF", rent:"~$40/SF all-in", monthly:"$10,117/mo",
      rating:"SOLID", badgeClass:"badge-solid", color:"#1B3A5C", rankClass:"",
      why:"Highest traffic (66K ADT), richest demographics ($180K HHI)", exclusive:null },
    { rank:5, name:"Bowie Marketplace", address:"15475 Annapolis Rd, Bowie, MD 20715",
      lat:38.9778, lng:-76.7344, sf:"1,518\u20137,526 SF", rent:"$29\u2013$35/SF", monthly:"Varies",
      rating:"CONDITIONAL", badgeClass:"badge-conditional", color:"#E65100", rankClass:"rank-conditional",
      why:"Best co-tenancy + lowest rent/SF, but CFA exclusive issue",
      exclusive:"Chick-fil-A clause (~25% threshold) \u2014 Southern Blues exceeds at ~30%" },
    { rank:6, name:"Severna Park Gateway", address:"8529 Veterans Hwy, Millersville, MD 21108",
      lat:39.0979, lng:-76.6226, sf:"2,800 SF", rent:"$43.75/SF all-in", monthly:"$10,208/mo",
      rating:"SOLID", badgeClass:"badge-solid", color:"#1B3A5C", rankClass:"",
      why:"2nd-gen endcap (former 7-Eleven), available now", exclusive:null },
    { rank:7, name:"Gambrills Center", address:"804 Crain Hwy, Gambrills, MD 21054",
      lat:39.0455, lng:-76.6667, sf:"2,700 SF", rent:"$56.50/SF all-in", monthly:"$12,713/mo",
      rating:"PREMIUM", badgeClass:"badge-premium", color:"#5e35b1", rankClass:"rank-premium",
      why:"New build validated by Starbucks, highest rent in survey", exclusive:null }
  ];

  var mapStyleUrls = {
    kepler: "mapbox://styles/mapbox/navigation-night-v1",
    satellite: "mapbox://styles/mapbox/satellite-streets-v12",
    streets: "mapbox://styles/mapbox/streets-v12",
    dark: "mapbox://styles/mapbox/dark-v11"
  };

  var map, markers = [], activeCard = null, openPopup = null;

  function buildPopupHTML(p) {
    var exc = p.exclusive
      ? '<div class="popup-exclusive">\u26A0\uFE0F ' + escapeHTML(p.exclusive) + '</div>'
      : "";

    return '' +
      '<div class="popup-header">' +
        '<div class="popup-name">' + p.rank + '. ' + escapeHTML(p.name) + '</div>' +
        '<div class="popup-address">' + escapeHTML(p.address) + '</div>' +
      '</div>' +
      '<div class="popup-body">' +
        '<div class="popup-row"><span class="popup-label">Available</span><span class="popup-value">' + escapeHTML(p.sf) + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Rent</span><span class="popup-value">' + escapeHTML(p.rent) + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Est. Monthly</span><span class="popup-value">' + escapeHTML(p.monthly) + '</span></div>' +
        '<div class="popup-row"><span class="popup-label">Why</span><span class="popup-value" style="max-width:160px;font-size:11px">' + escapeHTML(p.why) + '</span></div>' +
        exc +
      '</div>' +
      '<div class="popup-badge-wrap"><span class="card-badge ' + p.badgeClass + '">' + escapeHTML(p.rating) + '</span></div>';
  }

  function escapeHTML(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function clearMarkers() {
    for (var i = 0; i < markers.length; i++) markers[i].remove();
    markers = [];
  }

  function closeOpenPopup() {
    if (openPopup) {
      openPopup.remove();
      openPopup = null;
    }
  }

  function addAllMarkers() {
    clearMarkers();
    closeOpenPopup();

    for (var j = 0; j < properties.length; j++) {
      (function (idx) {
        var p = properties[idx];

        var el = document.createElement("div");
        el.style.cssText =
          "width:34px;height:34px;border-radius:50%;background:" + p.color +
          ";border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;" +
          "display:flex;align-items:center;justify-content:center;color:white;font-weight:700;" +
          "font-size:14px;font-family:Inter,sans-serif;";
        el.textContent = String(p.rank);

        var popup = new mapboxgl.Popup({ offset: 20, maxWidth: "320px", closeButton: true })
          .setHTML(buildPopupHTML(p));

        popup.on("open", function () { openPopup = popup; });
        popup.on("close", function () { if (openPopup === popup) openPopup = null; });

        var marker = new mapboxgl.Marker({ element: el })
          .setLngLat([p.lng, p.lat])
          .setPopup(popup)
          .addTo(map);

        el.addEventListener("click", function () {
          setActiveCardByIndex(idx);
        });

        markers.push(marker);
      })(j);
    }
  }

  function setActiveCardByIndex(idx) {
    var list = document.getElementById("propertyList");
    var cards = list.querySelectorAll(".property-card");
    if (activeCard) activeCard.classList.remove("active");
    if (cards[idx]) {
      cards[idx].classList.add("active");
      activeCard = cards[idx];
      cards[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function flyToAndOpen(idx) {
    var p = properties[idx];
    closeOpenPopup();

    map.flyTo({ center: [p.lng, p.lat], zoom: 14, pitch: 45, duration: 1200 });

    map.once("moveend", function () {
      markers[idx].togglePopup();
      openPopup = markers[idx].getPopup();
    });
  }

  function buildSidebar() {
    var list = document.getElementById("propertyList");
    list.innerHTML = "";

    for (var i = 0; i < properties.length; i++) {
      (function (idx) {
        var p = properties[idx];

        var card = document.createElement("div");
        card.className = "property-card";

        var rc = p.rankClass ? " " + p.rankClass : "";
        card.innerHTML =
          '<div class="card-header">' +
            '<span class="card-rank' + rc + '">' + p.rank + '</span>' +
            '<span class="card-name">' + escapeHTML(p.name) + '</span>' +
          '</div>' +
          '<div class="card-location">' + escapeHTML(p.address) + '</div>' +
          '<div class="card-details">' +
            '<div class="card-detail"><strong>' + escapeHTML(p.sf) + '</strong></div>' +
            '<div class="card-detail"><strong>' + escapeHTML(p.rent) + '</strong></div>' +
            '<div class="card-detail"><strong>' + escapeHTML(p.monthly) + '</strong></div>' +
          '</div>' +
          '<div><span class="card-badge ' + p.badgeClass + '">' + escapeHTML(p.rating) + '</span></div>';

        card.addEventListener("click", function () {
          setActiveCardByIndex(idx);
          flyToAndOpen(idx);
        });

        list.appendChild(card);
      })(i);
    }
  }

  function wireStyleSwitcher() {
    var styleBtns = document.querySelectorAll("#styleSwitcher .style-btn");
    for (var s = 0; s < styleBtns.length; s++) {
      styleBtns[s].addEventListener("click", function () {
        var styleName = this.getAttribute("data-style");
        if (!mapStyleUrls[styleName]) return;

        for (var b = 0; b < styleBtns.length; b++) styleBtns[b].classList.remove("active");
        this.classList.add("active");

        closeOpenPopup();
        map.setStyle(mapStyleUrls[styleName]);
      });
    }
  }

  map = new mapboxgl.Map({
    container: "map",
    style: mapStyleUrls.satellite,
    center: [-76.71, 39.01],
    zoom: 10.5,
    pitch: 30
  });

  map.addControl(new mapboxgl.NavigationControl(), "bottom-right");

  wireStyleSwitcher();

  map.on("style.load", function () {
    addAllMarkers();
  });

  map.on("load", function () {
    addAllMarkers();
    buildSidebar();
    setActiveCardByIndex(0);
  });

})();
</script>

</body>
</html>
